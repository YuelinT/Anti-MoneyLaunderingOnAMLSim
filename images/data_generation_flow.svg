<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Three independent AMLSim runs feed one evaluation protocol</title>
  <desc id="flow-desc">Train uses seed 42, validation seed 43, and test seed 44. Each is generated as a separate 180-day, 4,000-account transaction graph, converted to account features, then used for fitting, selection, or final evaluation respectively. Account IDs do not carry across runs.</desc>
  <rect width="1100" height="520" rx="24" fill="#F0F0EE"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="57" font-size="26" font-weight="700" fill="#1F1E1C"><tspan fill="#F5572F">Three independent runs</tspan>, one shared protocol</text>
    <text x="48" y="86" font-size="14" fill="#6E6D66">Same settings apart from simulation name and seed · each graph covers 180 simulated days</text>
    <line x1="48" y1="117" x2="1052" y2="117" stroke="#C0BFB7" stroke-width="1"/>

    <g font-size="11" font-weight="700" letter-spacing="1.1" fill="#8F8E86">
      <text x="225" y="145" text-anchor="middle">CONFIGURATION</text>
      <text x="460" y="145" text-anchor="middle">INDEPENDENT GRAPH</text>
      <text x="710" y="145" text-anchor="middle">ACCOUNT FEATURES</text>
      <text x="955" y="145" text-anchor="middle">EXPERIMENTAL ROLE</text>
    </g>

    <!-- Each row keeps the Trend Lineage template's event markers and hairline guides. -->
    <g stroke="#C0BFB7" stroke-width="1.4" fill="none">
      <line x1="225" y1="202" x2="955" y2="202"/>
      <line x1="225" y1="308" x2="955" y2="308"/>
      <line x1="225" y1="414" x2="955" y2="414"/>
    </g>
    <g fill="#1F1E1C">
      <circle cx="225" cy="202" r="6"/><circle cx="460" cy="202" r="6"/><circle cx="710" cy="202" r="6"/><circle cx="955" cy="202" r="6"/>
      <circle cx="225" cy="308" r="6"/><circle cx="460" cy="308" r="6"/><circle cx="710" cy="308" r="6"/><circle cx="955" cy="308" r="6"/>
      <circle cx="225" cy="414" r="6"/><circle cx="460" cy="414" r="6"/><circle cx="710" cy="414" r="6"/><circle cx="955" cy="414" r="6"/>
    </g>

    <g font-size="15" font-weight="800" fill="#1F1E1C">
      <text x="48" y="204">TRAIN</text><text x="48" y="310">VALIDATION</text><text x="48" y="416">TEST</text>
    </g>
    <g font-size="13" fill="#6E6D66">
      <text x="48" y="224">seed 42</text><text x="48" y="330">seed 43</text><text x="48" y="436">seed 44</text>
    </g>
    <g font-size="14" font-weight="700" fill="#1F1E1C" text-anchor="middle">
      <text x="225" y="230">course_train_s42</text><text x="460" y="230">38,206 transactions</text><text x="710" y="230">4,000 account rows</text><text x="955" y="230">Fit models</text>
      <text x="225" y="336">course_val_s43</text><text x="460" y="336">37,790 transactions</text><text x="710" y="336">4,000 account rows</text><text x="955" y="336">Choose settings</text>
      <text x="225" y="442">course_test_s44</text><text x="460" y="442">38,301 transactions</text><text x="710" y="442">4,000 account rows</text><text x="955" y="442">Report metrics</text>
    </g>
    <g font-size="12" fill="#6E6D66" text-anchor="middle">
      <text x="460" y="249">232 SAR accounts</text><text x="710" y="249">from raw transactions</text>
      <text x="460" y="355">211 SAR accounts</text><text x="710" y="355">from raw transactions</text>
      <text x="460" y="461">232 SAR accounts</text><text x="710" y="461">from raw transactions</text>
    </g>
    <line x1="48" y1="484" x2="1052" y2="484" stroke="#C0BFB7" stroke-width="1"/>
    <text x="48" y="507" font-size="10" font-weight="700" letter-spacing="1" fill="#8F8E86">SOURCE · AMLSIM CONFIGURATIONS AND VALIDATED DATASET EXPORTS</text>
    <text x="1052" y="507" font-size="11" text-anchor="end" fill="#6E6D66">Account IDs are local to each run</text>
  </g>
</svg>
